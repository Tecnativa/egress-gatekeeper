services:
  odoo:
    image: tecnativa/egress-doodba-odoo-test:${ODOO_VERSION-18.0}
    pull_policy: "never"
    build:
      context: ./odoo
      args:
        DB_VERSION: "18"
        ODOO_VERSION: "${ODOO_VERSION-18.0}"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        GITHUB_TOKEN: "${DOODBA_GITHUB_TOKEN}"
    environment:
      EMAIL_FROM: ""
      PGDATABASE: &dbname odoo
      PGUSER: &dbuser "odoo"
      PROXY_MODE: "true"
      GITHUB_TOKEN: "${DOODBA_GITHUB_TOKEN}"
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8069/web/health"]
      interval: 1m
      timeout: 1s
      retries: 3
      start_period: 30s
      start_interval: 1s
    volumes:
      - filestore:/var/lib/odoo
    labels:
      traefik.backend.buffering.retryExpression: IsNetworkError() && Attempts() < 5
      traefik.docker.network: "inverseproxy_shared"
      traefik.frontend.passHostHeader: "true"
      traefik.port: "8069"

  db:
    image: ghcr.io/tecnativa/postgres-autoconf:18-alpine
    shm_size: 4gb
    environment:
      POSTGRES_DB: *dbname
      POSTGRES_USER: *dbuser
      PGDATA: "/var/lib/postgresql/data"
      CONF_EXTRA: |
        work_mem = 512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s
    volumes:
      - db:/var/lib/postgresql/data

  smtpfake:
    image: docker.io/mailhog/mailhog
