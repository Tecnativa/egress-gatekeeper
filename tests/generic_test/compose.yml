services:
  traefik:
    image: traefik:latest
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:8081
    ports:
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
      public:

  bouncer:
    image: tecnativa/egress-gatekeeper:testonly
    pull_policy: "never"
    depends_on:
      - traefik
    cap_add:
      - NET_ADMIN
    environment:
      ALLOWED_HOSTS: >
        www.tecnativa.com 1.1.1.1
      REFRESH_INTERVAL: 300
    networks:
      default:
      public:
    labels:
      - traefik.enable=true
      - traefik.http.routers.main.rule=PathPrefix(`/`)
      - traefik.http.routers.main.entrypoints=web
      - traefik.http.services.main.loadbalancer.server.port=8081

  main:
    image: docker.io/sosedoff/pgweb
    environment:
      PGWEB_DATABASE_URL: postgres://test:test@db:5432/test?sslmode=disable
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: test
      PGUSER: test
      PGPASSWORD: test
    network_mode: service:bouncer
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/"]
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      traefik:
        condition: service_started
      db:
        condition: service_started
      bouncer:
        condition: service_healthy
  db:
    image: ghcr.io/tecnativa/postgres-autoconf:18-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:

networks:
  default:
    internal: true
  public:
